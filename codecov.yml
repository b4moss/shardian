codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

ignore:
  - "packages/node/dist/**"
  - "packages/node/coverage/**"
  - "**/*.test.ts"
  - "**/*.test.js"
  - "**/*.d.ts"
