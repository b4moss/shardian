codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

ignore:
  - "packages/node/dist/**"
  - "packages/node/coverage/**"
  - "packages/php/vendor/**"
  - "packages/php/coverage/**"
  - "packages/php/.phpunit.cache/**"
  # Composer files-autoload data const; executed at PHPUnit bootstrap before coverage starts
  - "packages/php/src/CommonExtensions.php"
  - "**/*.test.ts"
  - "**/*.test.js"
  - "**/*.d.ts"
  - "**/tests/**"
