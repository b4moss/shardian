name: Split PHP package

# Mirror packages/php → github.com/b4moss/shardian-php for Packagist.
# - main / release push (packages/php changed): update mirror main
# - tag packages/php/vX.Y.Z: update mirror main + tag vX.Y.Z + Packagist ping
# Requires:
#   - SHARDIAN_PHP_DEPLOY_KEY (deploy key on shardian-php, write)
#   - PACKAGIST_USERNAME / PACKAGIST_TOKEN (optional but recommended; Packagist update API)
# Dist repo should also have a GitHub webhook → Packagist (auto-update).
# See https://github.com/b4moss/shardian/issues/73
on:
  push:
    branches:
      - main
      - release
    tags:
      - "packages/php/v[0-9]*"
  workflow_dispatch:

concurrency:
  group: split-php-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  split:
    name: push to shardian-php
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup SSH deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SHARDIAN_PHP_DEPLOY_KEY }}

      - name: Split and push
        env:
          MIRROR_REPO: git@github.com:b4moss/shardian-php.git
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/split-php.sh

      - name: Ping Packagist update
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'packages/php/v')
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -z "${PACKAGIST_TOKEN:-}" || -z "${PACKAGIST_USERNAME:-}" ]]; then
            echo "PACKAGIST_USERNAME / PACKAGIST_TOKEN not set; skip Packagist ping (rely on GitHub webhook)."
            exit 0
          fi
          curl -sS -X POST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"repository":{"url":"https://github.com/b4moss/shardian-php"}}'
          echo
