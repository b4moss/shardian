name: Release on tag

# Language-scoped tags only:
#   vX.Y.Z              → Node (@b4moss/shardian)
#   packages/go/vX.Y.Z  → Go module (no npm)
on:
  push:
    tags:
      - "v[0-9]*"
      - "packages/go/v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          PRE=()
          if [[ "$TAG" =~ (alpha|beta|rc|rev|doc|docs) ]]; then
            PRE+=(--prerelease)
          fi
          TITLE="$TAG"
          if [[ "$TAG" == packages/go/v* ]]; then
            TITLE="Go ${TAG#packages/go/}"
          elif [[ "$TAG" == v* ]]; then
            TITLE="Node ${TAG}"
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --generate-notes \
            --verify-tag \
            "${PRE[@]}"
