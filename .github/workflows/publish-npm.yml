name: Publish npm

# Node port only. Go-only merges to release must not publish to npm.
# Independent SemVer: packages/node/package.json + root tag vX.Y.Z.
on:
  push:
    branches:
      - release
    paths:
      - "packages/node/**"

concurrency:
  group: publish-npm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish @b4moss/shardian
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/node
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Decide whether to publish
        id: decide
        working-directory: .
        run: bash .github/scripts/should-publish-shardian.sh

      - name: Test
        if: steps.decide.outputs.skip != 'true'
        run: npm test

      - name: Publish to npm
        if: steps.decide.outputs.skip != 'true'
        run: npm publish --access public --provenance
